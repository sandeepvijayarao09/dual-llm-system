# Full stack: Postgres + API + web UI. Gemma runs in Ollama on the host
# (Docker on macOS has no GPU access, so a containerised Ollama would be slow).
#   ollama serve & ollama pull gemma4:e4b
#   cp .env.example .env   # add GEMINI_API_KEY
#   docker compose up --build
# On a Linux GPU host, run Ollama in compose instead:
#   docker compose --profile ollama up --build   (and set OLLAMA_BASE_URL=http://ollama:11434)
# Web UI: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dual_llm
      POSTGRES_PASSWORD: dual_llm
      POSTGRES_DB: dual_llm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dual_llm"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dual_llm:dual_llm@db:5432/dual_llm
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000      # baked into the Next.js rewrites at build time
    ports:
      - "3000:3000"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:0.32.1
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  ollama:
