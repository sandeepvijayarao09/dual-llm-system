# Full stack: Postgres + API + web UI.
#   cp .env.example .env   # add your API key(s)
#   docker compose up --build
# Web UI: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dual_llm
      POSTGRES_PASSWORD: dual_llm
      POSTGRES_DB: dual_llm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dual_llm"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dual_llm:dual_llm@db:5432/dual_llm
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000      # baked into the Next.js rewrites at build time
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
