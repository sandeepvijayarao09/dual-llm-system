name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run mypy
      # No API key needed: the LLM clients are faked in tests/conftest.py.
      - run: uv run pytest -q
      # The published router numbers must still reproduce from the committed model.
      - name: Reproduce the 1000-case eval
        run: |
          uv run python -m router.eval_1000 | tee eval.txt
          grep -q "Accuracy (1000-case): 92.6%" eval.txt
          grep -q "TP =   438       FN =    17" eval.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dual-llm-api .
      - run: docker build -t dual-llm-web web
